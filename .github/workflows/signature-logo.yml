name: Generate email-signature PNG
on:
  push:
    paths:
      - '.github/workflows/signature-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render original logo and signature icons
        run: |
          python -m pip install --quiet cairosvg pillow playwright
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import io
          from PIL import Image
          import cairosvg

          # Browser rendering preserves SVG filters that CairoSVG misrenders as black polygons.
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          svg = Path("assets/wunderwerkstatt-signatur.svg").resolve().as_uri()
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page(viewport={"width":1920,"height":1080}, device_scale_factor=1)
              page.goto(svg)
              page.locator("svg").screenshot(path="assets/signatur-logo-render.png", omit_background=True)
              browser.close()
          im = Image.open("assets/signatur-logo-render.png").convert("RGBA")
          Path("assets/signatur-logo-render.png").unlink()
          box = im.getchannel("A").getbbox()
          if not box:
              raise SystemExit("Original logo contains no visible pixels")
          x0, y0, x1, y1 = box
          margin = 18
          crop = im.crop((max(0,x0-margin),max(0,y0-margin),
                          min(im.width,x1+margin),min(im.height,y1+margin)))
          crop.save("assets/signatur-logo.png", optimize=True)

          whatsapp = '''<svg fill="#62775e" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>'''
          pin = """<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"><path fill="none" stroke="#62775e" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="2.6" fill="none" stroke="#62775e" stroke-width="1.8"/></svg>"""
          cairosvg.svg2png(bytestring=whatsapp.encode(),write_to="assets/signatur-whatsapp.png",output_width=96,output_height=96)
          cairosvg.svg2png(bytestring=pin.encode(),write_to="assets/signatur-standort.png",output_width=96,output_height=96)
          PY
      - name: Commit generated PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signatur-logo.png assets/signatur-whatsapp.png assets/signatur-standort.png
          if ! git diff --cached --quiet; then
            git commit -m "Provide stable PNG images for email signature"
            git push
          fi
