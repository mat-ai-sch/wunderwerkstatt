name: Generate email-signature PNG
on:
  push:
    paths:
      - '.github/workflows/signature-logo.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert original SVG to tightly cropped PNG
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import io
          from PIL import Image
          import cairosvg
          png = cairosvg.svg2png(url="assets/wunderwerkstatt-signatur.svg", output_width=1920, output_height=1080)
          im = Image.open(io.BytesIO(png)).convert("RGBA")
          box = im.getchannel("A").getbbox()
          if not box:
              raise SystemExit("Original SVG returned no visible pixels")
          x0,y0,x1,y1 = box
          pad = 18
          crop = im.crop((max(0,x0-pad),max(0,y0-pad),min(im.width,x1+pad),min(im.height,y1+pad)))
          crop.save("assets/signatur-logo.png", optimize=True)
          print("Original bounds:", box, "Final PNG:", crop.size)
          PY
      - name: Commit generated PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signatur-logo.png
          if ! git diff --cached --quiet; then
            git commit -m "Add tightly cropped email signature logo PNG"
            git push
          fi
