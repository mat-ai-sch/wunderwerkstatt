<main>
  <h1 id="title" tabindex="-1">Anmelden</h1>
  <p id="status" role="status" aria-live="polite">Anmeldung wird geladen …</p>
  <noscript>Bitte aktiviere JavaScript, um dich anzumelden.</noscript>
  <section id="login" hidden>
    <form id="email-login">
      <label class="sr-only" for="login-address">E-Mail-Adresse</label>
      <input id="login-address" name="email" type="email" placeholder="E-Mail-Adresse" autocomplete="username" autocapitalize="none" required maxlength="254">
      <div id="login-password-field">
        <label class="sr-only" for="login-password">Passwort</label>
        <input id="login-password" name="password" type="password" placeholder="Passwort" autocomplete="current-password" required>
      </div>
      <button type="submit" id="email-submit">Mit E-Mail anmelden</button>
    </form>
    <p id="email-feedback" role="status" aria-live="polite"></p>
    <div class="login-links">
      <button type="button" class="text-button" id="forgot">Passwort vergessen?</button>
      <button type="button" class="text-button" id="without-password">Mit E-Mail-Link anmelden</button>
      <button type="button" class="text-button" id="back-to-password" hidden>Zurück zur Anmeldung</button>
    </div>
    <a class="guest-button" href="./gast/">Als Gast anmelden</a>
    <div class="separator"><span>oder</span></div>
    <div class="providers" role="group" aria-label="Weitere Anmeldeoptionen">
      <button type="button" class="provider google" id="google" aria-label="Mit Google anmelden" title="Mit Google anmelden"><img src="./google.png" alt=""></button>
      <button type="button" class="provider amazon" id="amazon" aria-label="Mit Amazon anmelden" title="Mit Amazon anmelden"><img src="./amazon.png" alt=""></button>
      <button type="button" class="provider" id="apple" aria-label="Mit Apple anmelden" title="Mit Apple anmelden" hidden><span aria-hidden="true">Apple</span></button>
      <button type="button" class="provider passkey" id="passkey-login" aria-label="Mit Passkey anmelden" title="Mit Passkey anmelden" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8.2" r="3"/><path d="M2 19c.2-3.1 2.4-5 6-5 1.1 0 2 .2 2.9.6"/><circle cx="17" cy="10.5" r="3"/><path d="M17 13.5v7l2-1.8-1.1-1.5 1-1.3-1.9-2.4"/></svg></button>
    </div>
    <p class="test-note">Kundenkonten sind derzeit für die Testphase reserviert.</p>
  </section>
  <a id="guest-fallback" class="guest-button" href="./gast/">Als Gast anmelden</a>
  <section id="profile" hidden>
    <p><strong id="session-login" role="status"></strong></p>
    <p id="email"></p>
    <dl id="details"></dl>
    <button id="edit" class="secondary">Angaben bearbeiten</button>
    <form id="form" hidden>
      <div id="fields"></div>
      <button type="submit">Angaben speichern</button>
      <button type="button" class="secondary" id="cancel">Zur Übersicht</button>
    </form>
    <details id="password-settings">
      <summary>Passwort festlegen</summary>
      <form id="new-password-form">
        <label for="new-password">Neues Passwort</label>
        <input type="password" id="new-password" autocomplete="new-password" minlength="8" required>
        <label for="repeat-password">Neues Passwort wiederholen</label>
        <input type="password" id="repeat-password" autocomplete="new-password" minlength="8" required>
        <button type="submit" id="save-password">Passwort speichern</button>
      </form>
      <p role="status" id="password-feedback"></p>
    </details>
    <section id="passkeys">
      <h2>Passkeys</h2>
      <p id="passkey-state"></p>
      <button id="register">Passkey hinzufügen</button>
      <p id="passkey-feedback" role="status"></p>
    </section>
    <section id="linked-accounts" hidden>
      <h2>Verknüpfte Konten</h2>
      <p id="linked-names"></p>
    </section>
    <section id="apple-account" hidden>
      <h2>Apple-Anmeldung</h2>
      <p id="apple-state" role="status"></p>
      <button type="button" class="secondary" id="apple-link" hidden>Apple Account verknüpfen</button>
    </section>
    <a href="https://wunderwerkstatt-entwurf-251026.matthiasschuermann.chatgpt.site/">Zum Schranklädchen</a>
  </section>
  <button id="logout" class="secondary" hidden>Abmelden</button>
</main>
<footer><a href="/datenschutz.html">Datenschutz</a> · <a href="/impressum.html">Impressum</a></footer>
</body>
</html>
